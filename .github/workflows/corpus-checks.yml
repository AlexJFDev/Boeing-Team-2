name: Corpus checks

# WBS 1.28 (issue #36). On every pull request, checks the task corpus two ways:
#   schema         bench/validate.py: every task file in data/tasks is well formed, uses
#                  existing preambles and matches its manifest (WBS 1.12/1.13/1.14);
#                  bench/corpus_doc.py: docs/corpus.md documents every task family and
#                  every source and oracle the tasks cite (WBS 3.10)
#   data-boundary  bench/boundary.py: data/ and prompts/ hold only approved-source data
#                  and no real-looking registrations or keys (WBS 1.27)
# With both jobs required status checks on development, a task that fails either one
# blocks the merge. Problems also appear as annotations on the PR's changed lines.

on:
  pull_request:
    branches: [development, production]
  push:
    branches: [development]

permissions:
  contents: read

concurrency:
  group: corpus-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# No path filter on purpose: a required check that is skipped never reports, and the
# PR waits for it forever. Both checks take seconds.

jobs:
  # Job names are the status checks branch protection requires; renaming one silently
  # drops the requirement, so tests/test_corpus_checks_workflow.py pins them.
  schema:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Exit 0 pass, 1 a problem was found. shell: bash adds pipefail, so tee keeps
      # the validator's exit status.
      - name: Validate every task file
        shell: bash
        run: python -m bench.validate --annotations | tee schema.log

      # Runs even when validation failed, so both sets of problems show on one push.
      - name: Check the corpus documentation
        if: success() || failure()
        shell: bash
        run: python -m bench.corpus_doc --annotations | tee corpus_doc.log

      - name: Write the job summary
        if: always()
        shell: bash
        run: |
          { echo "## Task schema check"; echo; echo '```';
            grep -v '^::' schema.log 2>/dev/null || echo "The validator did not run; see the job log.";
            echo '```'; echo; echo "## Corpus documentation check"; echo; echo '```';
            grep -v '^::' corpus_doc.log 2>/dev/null || echo "The check did not run; see the job log.";
            echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  data-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # bench/boundary.py uses only the standard library, so nothing is installed.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Check the data boundary
        shell: bash
        run: python -m bench.boundary --annotations | tee boundary.log

      - name: Write the job summary
        if: always()
        shell: bash
        run: |
          { echo "## Data boundary check"; echo; echo '```';
            grep -v '^::' boundary.log 2>/dev/null || echo "The checker did not run; see the job log.";
            echo '```'; } >> "$GITHUB_STEP_SUMMARY"
