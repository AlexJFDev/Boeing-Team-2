name: Regression

# WBS 1.26 (issue #34). Runs the regression set (WBS 1.25, bench/regression.py) on every
# pull request and fails if any score differs from the committed baseline. With
# "regression" a required status check on development, a failing run blocks the merge.
# The set needs no model, Docker or network: a replay solver supplies canned answers.

on:
  pull_request:
    branches: [development, production]
  # Also on development itself, so two PRs that pass alone but break scoring together
  # are caught after the merge.
  push:
    branches: [development]

permissions:
  contents: read
  pull-requests: write   # to post the report on the PR; nothing else is written

concurrency:
  group: regression-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # The job name is the status check that branch protection requires. Renaming it
  # silently drops the requirement, so tests/test_regression_workflow.py pins it.
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Same interpreter as tests.yml and the project .venv.
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Exit 0 pass, 1 a score or setup item differs, 2 the baseline is missing or
      # edited. Any non-zero exit fails this step and the check.
      - name: Run the regression set against the baseline
        run: python -m bench.regression check --log-dir regression-log --markdown regression-report.md

      - name: Write the job summary
        if: always()
        run: |
          if [ -f regression-report.md ]; then
            cat regression-report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Regression check: ERROR" >> "$GITHUB_STEP_SUMMARY"
            echo "No report was written; see the job log." >> "$GITHUB_STEP_SUMMARY"
          fi

      # One comment per PR, updated on every push. A failure here (for example a PR
      # from a fork, whose token cannot comment) does not change the check result.
      - name: Post the report on the pull request
        if: always() && github.event_name == 'pull_request' && hashFiles('regression-report.md') != ''
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('regression-report.md', 'utf8');
            const marker = '<!-- bench-regression-report -->';
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments,
                                                   { owner, repo, issue_number });
            const mine = comments.find(c => c.user.type === 'Bot' && c.body.includes(marker));
            if (mine) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Keep the regression EvalLog
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-log
          path: regression-log/
          if-no-files-found: ignore
          retention-days: 14
