# Baseline evaluation of the ADS-B and ARINC 429 suites (WBS 3.8, issue #63).
#   bench baseline configs/baseline_v1.0.0.yaml
# Every task runs against every model with Inspect's eval_set. Logs and the report go
# to logs/baseline/v1.0.0 (git-ignored); running again resumes an interrupted baseline.
# Needs a local Ollama with each model pulled (`ollama pull llama3.1`, ...). For VT ARC,
# copy this file and list the vllm/... model instead; see docs/baseline.md.
baseline_version: 1.0.0
tasks:
  - tasks/a1_adsb_decode.py               # A1 v1.2.0, 29 samples
  - tasks/a2_cpr_position.py              # A2 v1.2.0, 28 samples
  - tasks/b1_arinc429_word_decode.py      # B1 v1.0.0, 27 samples
  - tasks/b2_arinc429_ssm_interpretation.py  # B2 v1.0.0, 14 samples
  - tasks/b3_arinc429_bus_conformance.py  # B3 v1.0.0, 16 samples
  - tasks/b4_arinc429_fault_vs_injection.py  # B4 v1.0.0, 15 samples
models:
  - ollama/llama3.1
  - ollama/qwen2.5:7b
  - ollama/mistral
generate_config:
  temperature: 0
  seed: 42
  max_tokens: 1024
metadata:
  corpus_version: protocol-suites-1.0.0
  suites: {a1: 1.2.0, a2: 1.2.0, b1: 1.0.0, b2: 1.0.0, b3: 1.0.0, b4: 1.0.0}
retry_attempts: 3
